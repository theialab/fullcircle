<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="icon" href="./logos/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="./logos/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" href="./logos/favicon.png" sizes="180x180">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --c-text: #1f2937;
      --c-muted: #4b5563;
      --c-bottom-text: white;
      --c-bottom-bg: #111827;
      --c-bottom-bg-hover: #374151;
      --c-section-divider: #e5e7eb;
      --fs-button: 15px;
      --fs-caption: 0.9rem;
      --fs-section-title: 1.4rem;
    }
    body {
      font-family: 'Noto Sans', sans-serif;
      color: var(--c-text);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 10px;
    }
    h1 {
      text-align: center;
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      color: var(--c-muted);
      margin-bottom: 20px;
    }

    /* top nav */
    .top-links {
      text-align: center;
      margin-bottom: 10px;
    }

    /* buttons */
    .custom-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: var(--c-bottom-bg);
      color: var(--c-bottom-text);
      padding: 10px 18px;
      border-radius: 20px;
      min-width: 100px;
      font-size: var(--fs-button);
      transition: 0.2s ease;
      margin: 0.1rem;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      vertical-align: middle;
      line-height: 1;
    }
    .custom-button:hover {
      background: var(--c-bottom-bg-hover);
      color: var(--c-bottom-text);
      transform: translateY(-1px);
    }
    .custom-button.active {
      background: var(--c-bottom-bg-hover);
      color: var(--c-bottom-text);
    }

    /* sections */
    .gallery-section {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--c-section-divider);
    }
    .gallery-section:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 1rem;
    }
    .section-title {
      font-size: var(--fs-section-title);
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .section-subtitle {
      text-align: center;
      color: var(--c-muted);
      font-size: var(--fs-caption);
      margin-bottom: 1.2rem;
    }
    .button-row {
      text-align: center;
      margin-bottom: 1rem;
    }

    /* video switcher */
    .video-container {
      display: none;
    }
    .video-container.active {
      display: block;
    }
    .scene-video {
      width: 100%;
      display: block;
      margin: 0 auto;
      max-width: 1100px;
    }

    /* placeholder */
    .placeholder-box {
      border: 2px dashed var(--c-section-divider);
      border-radius: 8px;
      padding: 3rem 1rem;
      text-align: center;
      color: var(--c-muted);
      font-size: var(--fs-caption);
    }
    .placeholder-box i {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: block;
      opacity: 0.4;
    }

    /* media */
    @media (max-width: 768px) {
      .container {
        padding: 16px 12px 8px;
      }
      :root {
        --fs-button: 14px;
        --fs-caption: 0.8rem;
        --fs-section-title: 1.15rem;
      }
      .custom-button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-links">
      <a href="index.html" class="custom-button">
        <i class="fas fa-arrow-left"></i>
        <span>Back to main page</span>
      </a>
    </div>

    <h1>Gallery</h1>
    <p class="subtitle">Additional qualitative results</p>

    <!-- ── Section 1: Rest of Scenes ───────────────────────── -->
    <div class="gallery-section">
      <h2 class="section-title">Rest of Scenes</h2>
      <p class="section-subtitle">13 scenes total — evaluated on a <strong>tripod</strong> test set.</p>

      <div class="button-row">
        <button class="custom-button" onclick="showVideo('s1-room1',    'sec1', this)">Room 1</button>
        <button class="custom-button"        onclick="showVideo('s1-flat1',    'sec1', this)">Flat 1</button>
        <button class="custom-button"        onclick="showVideo('s1-bedroom2', 'sec1', this)">Bedroom 1</button>
        <button class="custom-button active" onclick="showVideo('s1-room3',    'sec1', this)">Room 3</button>
        <button class="custom-button"        onclick="showVideo('s1-lab',      'sec1', this)">Lab</button>
        <button class="custom-button"        onclick="showVideo('s1-kitchen',  'sec1', this)">Kitchen</button>
        <button class="custom-button"        onclick="showVideo('s1-persons',  'sec1', this)">Persons</button>
        <button class="custom-button"        onclick="showVideo('s1-dark',     'sec1', this)">Dark</button>
        <button class="custom-button"        onclick="showVideo('s1-bedroom3', 'sec1', this)">Bedroom 2</button>
        <button class="custom-button"        onclick="showVideo('s1-oslo',     'sec1', this)">Oslo</button>
      </div>

      <div id="s1-room1" class="video-container active" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/room1.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-flat1" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/flat1.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-bedroom2" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/bedroom2.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-room3" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/room3.mp4" type="video/mp4">

      </div>
      <div id="s1-lab" class="video-container" data-group="sec1">

      <div id="s1-kitchen" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/kitchen.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-persons" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/persons.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-dark" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/dark.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s1-bedroom3" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/fullcircle/bedroom3.mp4" type="video/mp4">

      <div id="s1-oslo" class="video-container" data-group="sec1">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">

      </div>
    </div>

    <!-- ── Section 2: Held-out Scenes ──────────────────────── -->
    <div class="gallery-section">
      <h2 class="section-title">Held-out Scenes</h2>
      <p class="section-subtitle">10 scenes total — evaluated on a <strong>masked held-out</strong> test set.</p>

      <div class="button-row">
        <button class="custom-button active" onclick="showVideo('s2-cs',       'sec2', this)">CS</button>
        <button class="custom-button"        onclick="showVideo('s2-trees',    'sec2', this)">Trees</button>

        <button class="custom-button"        onclick="showVideo('s2-street2',  'sec2', this)">Street 2</button>
        <button class="custom-button"        onclick="showVideo('s2-lounge2',  'sec2', this)">Lounge 2</button>
        <button class="custom-button"        onclick="showVideo('s2-robot',    'sec2', this)">Robot</button>
      </div>

      <div id="s2-cs" class="video-container active" data-group="sec2">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">

        </video>
      </div>
      <div id="s2-trees" class="video-container" data-group="sec2">

      </div>
    </div>

    <!-- ── Section 3: Internet Videos ───────────────────── -->
    <div class="gallery-section">
      <h2 class="section-title">Internet Videos</h2>
      <p class="section-subtitle">Qualitative masking results on internet videos.</p>

      <div class="button-row">
        <button class="custom-button active" onclick="showVideo('s3-car', 'sec3', this)">Car</button>
        <button class="custom-button" onclick="showVideo('s3-dormitory', 'sec3', this)">Dormitory</button>

      <div id="s3-car" class="video-container active" data-group="sec3">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/internet/car.mp4" type="video/mp4">
        </video>
      </div>
      <div id="s3-dormitory" class="video-container" data-group="sec3">
        <video class="scene-video" autoplay muted loop playsinline preload="auto">
          <source src="static/videos/results/internet/dormitory.mp4" type="video/mp4">
        </video>
      </div>
    </div>

  </div>

  <script>
    function showVideo(videoId, group, btn) {
      document.querySelectorAll('.video-container[data-group="' + group + '"]')
        .forEach(v => v.classList.remove('active'));

      const selected = document.getElementById(videoId);
      if (selected) selected.classList.add('active');

      if (btn) {
        btn.closest('.button-row').querySelectorAll('.custom-button')
          .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    }
  </script>
</body>
</html>
